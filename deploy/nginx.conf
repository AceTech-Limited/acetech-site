# nginx site config for acetechlimited.net
# Install to /etc/nginx/sites-available/acetechlimited.net and symlink into sites-enabled.
# Certbot rewrites the TLS block below when you run it, so install this HTTP-only
# version first, then run certbot and let it do the redirect and the cert lines.

server {
    listen 80;
    listen [::]:80;
    server_name acetechlimited.net www.acetechlimited.net;

    root /var/www/acetechlimited.net;
    index index.html;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for fingerprint-free static assets is unsafe, so keep it short
    # and let the HTML revalidate.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/acetechlimited.access.log;
    error_log  /var/log/nginx/acetechlimited.error.log;
}
